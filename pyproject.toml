[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-meter-insights"
version = "0.1.0"
description = "A transparent local pipeline for synthetic interval meter readings"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
energy-insights = "energy_meter_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
